<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nucleus — Simulador AHP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#1d63ed',
                            darkBlue: '#1548b8',
                            lightBlue: '#ebf2ff'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body class="bg-white text-slate-900 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

    <!-- HEADER / NAVIGATION (Tema Claro) -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-end">
            <a href="main.html"
                class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg bg-brand-blue text-white font-medium text-sm hover:bg-blue-700 transition-all shadow-sm shadow-blue-500/20 active:scale-95 gap-2">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>Voltar ao Site</span>
            </a>
        </div>
    </header>

    <!-- Main Expanded Container -->
    <main class="flex-1 flex items-center justify-center p-0 sm:p-4 bg-slate-50">
        <div
            class="relative w-full max-w-7xl h-[calc(100vh-4rem)] sm:h-[calc(100vh-6rem)] sm:rounded-2xl border-0 sm:border sm:border-slate-200 shadow-xl overflow-hidden bg-white">

            <div id="flutterLoadingOverlay"
                class="absolute inset-0 z-10 bg-white flex flex-col items-center justify-center gap-3 text-slate-600">
                <div class="w-9 h-9 border-4 border-brand-blue border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs sm:text-sm font-medium">A carregar Simulador Nucleus...</p>
            </div>

            <iframe id="flutterAppFrame"
                src="app/"
                title="Simulador AHP Nucleus"
                allow="geolocation; clipboard-write"
                onload="document.getElementById('flutterLoadingOverlay')?.classList.add('hidden')"
                class="w-full h-full border-0 bg-white block">
            </iframe>
        </div>
    </main>
</body>

</html>
